<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DON WEAR</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 15px; }
        h1 { color: #d4af37; margin-bottom: 5px; }
        p.subtitle { color: #aaa; font-size: 14px; margin-bottom: 20px; }
        .grid { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .card { background: #1e1e1e; border-radius: 12px; padding: 12px; width: 160px; border: 1px solid #333; }
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; }
        .title { font-weight: bold; font-size: 14px; margin: 10px 0 5px; color: #eee; }
        .price { color: #d4af37; font-weight: bold; font-size: 13px; margin-bottom: 10px; }
        .btn { background: #d4af37; color: #000; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn:active { opacity: 0.8; }
    </style>
</head>
<body>

    <h1>DON WEAR</h1>
    <p class="subtitle">Rich Casual & Smart Classic</p>

    <div class="grid">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1551028719-00167b16eac5?w=500" alt="Suede Bomber">
            <div class="title">Suede Bomber Jacket</div>
            <div class="price">450,000 UZS</div>
            <button class="btn" onclick="buyItem('Suede Bomber Jacket', '450,000 UZS')">Sotib olish</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1521223890158-f9f7c3d5d504?w=500" alt="Leather Jacket">
            <div class="title">Leather Jacket Classic</div>
            <div class="price">520,000 UZS</div>
            <button class="btn" onclick="buyItem('Leather Jacket Classic', '520,000 UZS')">Sotib olish</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Oynani to'liq ekranga yoyish

        function buyItem(name, price) {
            const data = {
                product: name,
                price: price
            };
            
            // Ma'lumotni Telegram botga yuborish va WebApp'ni yopish
            tg.sendData(JSON.stringify(data));
        }
    </script>
</body>
</html>
